// Get URL parameters
function getUrlParameter(name) {
    name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
    const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
    const results = regex.exec(location.search);
    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
}

// Load news content on page load
document.addEventListener('DOMContentLoaded', function() {
    const newsId = getUrlParameter('id');
    const news = fullNewsData[newsId];
    
    if (news) {
        document.getElementById('newsTitle').textContent = news.title;
        document.getElementById('newsDate').textContent = news.date;
        document.getElementById('newsContent').innerHTML = news.content;
        
        // Load related links
        const relatedLinksContainer = document.getElementById('relatedLinks');
        if (news.relatedLinks) {
            news.relatedLinks.forEach(link => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" class="related-link">${link}</a>`;
                relatedLinksContainer.appendChild(li);
            });
        }
        
        // Update page title
        document.title = news.title + ' - University Announcements';
    } else {
        // News not found
        document.getElementById('newsTitle').textContent = 'Announcement not found';
        document.getElementById('newsContent').innerHTML = '<p>Sorry, the requested announcement could not be found.</p>';
    }
});

function confirmLogout() {
    if (confirm('Are you sure you want to log out?')) {
        window.location.href = '/logout';
    }
}

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="form-container">
        <h1>Welcome</h1>
        <form class="form" id="login-form">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="form-button">Log In</button>
            <div id="message" class="error-message"></div>
        </form>
        <hr class="form-separator">
        <h2>Don't have an account?</h2>
        <button onclick="window.location.href='/signup'" class="secondary-button">Sign Up</button>

    </div>

    <script>
        (async () => {
        const response = await fetch('/check-session');
        const result = await response.json();
        if (result.loggedIn) {
            window.location.replace('/dashboard');
        }
        })();
        const loginForm = document.getElementById('login-form');
        const messageDiv = document.getElementById('message');  
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); 
            const formData = new FormData(loginForm); 
            const jsonData = Object.fromEntries(formData.entries()); // Convert form data to a JSON object.
            
            try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonData),
            });

            const result = await response.json();

            if (!response.ok) {
                messageDiv.textContent = result.error || 'Login failed.';
                messageDiv.className = 'error-message';
                return;
            }

            // Redirect to the dashboard after a successful login.
            window.location.href = '/dashboard';

        } catch (error) {
            console.error('Login Error:', error);
            messageDiv.textContent = 'Login failed. Please try again.';
            messageDiv.className = 'error-message';
        }
        });   
    </script>
</body>
</html>
